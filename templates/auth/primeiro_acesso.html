<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="stylesheet" href="/statics/css/auth/primeiro_acesso.css">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>ProtheusData - Primeiro acesso</title>
</head>
<body>
    <div class="first-access-container">
        <div class="first-access-area">
            <p class="first-access-kicker">Acesso protegido</p>
            <h1>Atualize sua senha</h1>
            <h2>{{ usuario_atual.nome }}</h2>
            <p class="first-access-intro">Por segurança, sua senha inicial é temporária. Antes de acessar os relatórios, defina uma nova senha pessoal.</p>

            <form id="primeiro-acesso-form">
                <div class="campo">
                    <label for="senha_atual">Senha atual</label>
                    <div class="campo-input-wrap">
                        <input type="password" id="senha_atual" name="senha_atual" placeholder="Digite a senha enviada por e-mail" autocomplete="current-password" required autofocus>
                        <button type="button" class="btn-ver-senha" data-alvo="senha_atual" aria-label="Mostrar senha"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </div>
                </div>
                <div class="campo">
                    <label for="nova_senha">Nova senha</label>
                    <div class="campo-input-wrap">
                        <input type="password" id="nova_senha" name="nova_senha" placeholder="Minimo 10 caracteres" autocomplete="new-password" required>
                        <button type="button" class="btn-ver-senha" data-alvo="nova_senha" aria-label="Mostrar senha"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </div>
                    <p class="campo-hint">Minimo 10 caracteres e pelo menos 1 numero.</p>
                </div>
                <div class="campo">
                    <label for="confirmar_senha">Confirmar nova senha</label>
                    <div class="campo-input-wrap">
                        <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Repita a nova senha" autocomplete="new-password" required>
                        <button type="button" class="btn-ver-senha" data-alvo="confirmar_senha" aria-label="Mostrar senha"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </div>
                </div>
                <button type="submit" id="btn-salvar">Salvar nova senha</button>
            </form>

            <div class="erro" id="erro" aria-live="polite"></div>

            <p class="link-sair"><a href="#" id="link-logout">Sair e voltar ao login</a></p>
        </div>
    </div>
    <script src="/statics/js/auth/primeiro_acesso.js"></script>
</body>
</html>
