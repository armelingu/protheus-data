<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="stylesheet" href="/statics/css/auth/primeiro_acesso.css">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>ProtheusData - Primeiro acesso</title>
</head>
<body>
    <div class="first-access-container">
        <div class="first-access-area">
            <p class="first-access-kicker">Acesso protegido</p>
            <h1>Atualize sua senha</h1>
            <h2>{{ usuario_atual.nome }}</h2>
            <p class="first-access-intro">Por segurança, sua senha inicial é temporária. Antes de acessar os relatórios, defina uma nova senha pessoal.</p>

            <form id="primeiro-acesso-form">
                <div class="campo campo-senha">
                    <label for="senha_atual">Senha atual</label>
                    <input type="password" id="senha_atual" name="senha_atual" placeholder="Digite a senha enviada por e-mail" autocomplete="current-password" required autofocus>
                    <button type="button" class="btn-ver-senha" data-alvo="senha_atual">ver</button>
                </div>
                <div class="campo campo-senha">
                    <label for="nova_senha">Nova senha</label>
                    <input type="password" id="nova_senha" name="nova_senha" placeholder="Minimo 10 caracteres" autocomplete="new-password" required>
                    <button type="button" class="btn-ver-senha" data-alvo="nova_senha">ver</button>
                    <p class="campo-hint">Minimo 10 caracteres e pelo menos 1 numero.</p>
                </div>
                <div class="campo campo-senha">
                    <label for="confirmar_senha">Confirmar nova senha</label>
                    <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Repita a nova senha" autocomplete="new-password" required>
                    <button type="button" class="btn-ver-senha" data-alvo="confirmar_senha">ver</button>
                </div>
                <button type="submit" id="btn-salvar">Salvar nova senha</button>
            </form>

            <div class="erro" id="erro" aria-live="polite"></div>

            <p class="link-sair"><a href="#" id="link-logout">Sair e voltar ao login</a></p>
        </div>
    </div>
    <script src="/statics/js/auth/primeiro_acesso.js"></script>
</body>
</html>
