<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="stylesheet" href="/statics/css/login/login.css">
    <title>ProtheusData - Login</title>
</head>
<body>
    <div class="login-container">
        <div class="login-area">
            <p class="login-kicker">Acesso interno</p>
            <h1>ProtheusData</h1>
            <h2>Central de Relatórios</h2>
            <p class="login-intro">Entre com sua conta corporativa para acessar os relatórios disponíveis no ambiente interno.</p>
            <form id="loginform">
                <div class="campo">
                    <label for="usuario">Usuário</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário" autocomplete="username" required autofocus>
                </div>
                <div class="campo">
                    <label for="senha">Senha</label>
                    <div class="campo-input-wrap">
                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
                        <button type="button" class="btn-ver-senha" data-alvo="senha" aria-label="Mostrar senha"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
                    </div>
                </div>
                <button type="submit">Entrar</button>
                <p class="link-esqueci"><a href="/esqueci-senha" id="link-esqueci-senha">Esqueci minha senha</a></p>
            </form>
            <div class="erro" id="erro" aria-live="polite"></div>
        </div>
    </div>
    <script src="/statics/js/login/login.js"></script>
</body>
</html>
